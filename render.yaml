services:
  - type: web
    name: heatline
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false   # paste your MongoDB Atlas connection string in the Render dashboard
      - key: MONGO_DB
        value: climate_hazards
      - key: TRUST_PROXY
        value: "1"
